services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-only-secret-key}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - backend-data:/app/db.sqlite3
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_equations &&
             gunicorn formulas_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
